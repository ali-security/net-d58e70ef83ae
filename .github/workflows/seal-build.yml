# Upstream golang.org/x/net has no GitHub Actions CI (it is tested on the Go
# project's own TryBot/LUCI infrastructure), so this workflow is written from
# scratch. It packages the module zip exactly as the module proxy does and runs
# the project's own test suite (`go test ./...`) on Linux, macOS and Windows.
# go.mod declares `go 1.26.0`, so the release toolchain is Go 1.26.
name: seal-build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Go package pattern(s) to test instead of ./...'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  module-zip:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false

      # Build the packaging helper in its own module OUTSIDE the checkout, so
      # `go get` never touches this repository's go.mod/go.sum.
      - name: Build module-zip helper
        run: |
          set -eux
          HELPER=$(mktemp -d)
          cp "$GITHUB_WORKSPACE/.github/create_mod.go" "$HELPER/"
          cd "$HELPER"
          go mod init example.com/mod
          go get golang.org/x/mod@v0.24.0
          go build -o "$RUNNER_TEMP/create_mod" .

      # golang.org/x/mod/zip skips .git but DESCENDS into .github, so this
      # workflow would otherwise leak into the zip as extra entries that the
      # public proxy artifact does not have. .gitignore and .gitattributes are
      # kept: they ARE part of the published module zip.
      - name: Create module zip
        run: |
          set -eux
          mkdir -p "$RUNNER_TEMP/out"
          rm -rf "$GITHUB_WORKSPACE/.github"
          "$RUNNER_TEMP/create_mod" \
            golang.org/x/net v0.59.0 \
            "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/out/v0.59.0.zip"
          unzip -l "$RUNNER_TEMP/out/v0.59.0.zip" | tail -5

      - uses: actions/upload-artifact@v4
        with:
          name: module-zip
          path: ${{ runner.temp }}/out/v0.59.0.zip
          if-no-files-found: error

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        # Windows would otherwise default to pwsh, where `set -eux` fails.
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build
        run: |
          set -eux
          go build ./...

      # -v so every test reports its own PASS/FAIL/SKIP line. The exit status
      # of `go test` is propagated unchanged (pipefail).
      - name: Test
        run: |
          set -euo pipefail
          go test -v ${{ inputs.test-filter || './...' }} 2>&1 | tee "$RUNNER_TEMP/go-test.log"

      # Go prints a skip's t.Skip message on an indented `file.go:N: msg` line
      # that can be far from the `--- SKIP:` line, so pair them up per test:
      # one line per skipped test with its reason, then a count per reason.
      # `\r` is stripped first because Windows go test output is CRLF.
      - name: Skipped tests with reasons
        if: always()
        run: |
          set -eu
          awk '
            { sub(/\r$/, "") }
            /^=== (RUN|CONT|NAME|PAUSE)[ \t]/ { cur = $3; next }
            /^[ \t]+[^ \t]+\.go:[0-9]+: / {
              if (cur != "" && !(cur in reason)) {
                r = $0
                sub(/^[ \t]+[^ \t]+\.go:[0-9]+: /, "", r)
                reason[cur] = r
              }
              next
            }
            /^[ \t]*--- SKIP: / {
              name = $3
              r = (name in reason) ? reason[name] : "(no message)"
              printf "SKIPPED %s -- reason: %s\n", name, r
              cnt[r]++
              n++
            }
            END {
              print "==== skipped tests per reason ===="
              for (r in cnt) printf "%6d skipped -- reason: %s\n", cnt[r], r
              printf "total skipped: %d\n", n
            }
          ' "$RUNNER_TEMP/go-test.log"

      - name: Test summary
        if: always()
        run: |
          set -eu
          awk '
            { sub(/\r$/, "") }
            /^(ok|FAIL|\?)[ \t]/ { print }
            /^ok[ \t]/ { pok++ }
            /^FAIL[ \t]/ { pfail++ }
            /^[ \t]*--- PASS/ { pass++ }
            /^[ \t]*--- FAIL/ { fail++ }
            /^[ \t]*--- SKIP/ { skip++ }
            END {
              print "==== go test summary ===="
              printf "packages ok: %d, packages FAIL: %d\n", pok, pfail
              printf "tests passed: %d, failed: %d, skipped: %d\n", pass, fail, skip
            }
          ' "$RUNNER_TEMP/go-test.log"
